<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Junaid Asghar | Contact</title>
  <meta name="description" content="Intentional contact pathways for collaboration, opportunities, and technical discussions." />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/utilities.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/pages/contact.css" />
</head>
<body class="page-contact">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header" data-site-header></header>

  <main id="main-content" class="site-main container">
    <section id="contact-intro" class="page-section section-header" data-reveal>
      <p class="eyebrow">Contact</p>
      <h1>Let’s connect with purpose.</h1>
      <p class="muted" data-contact-intro></p>
    </section>

    <section id="contact-actions" class="page-section stack" data-reveal>
      <h2>Primary pathways</h2>
      <p class="muted">Choose the channel that matches your goal—quick outreach, technical review, or professional context.</p>
      <div class="contact-cards" data-contact-cards></div>
    </section>

    <section id="collaboration" class="page-section contact-meta-grid" data-reveal>
      <article class="panel panel--glass stack" aria-labelledby="availability-title">
        <h2 id="availability-title">Availability & collaboration</h2>
        <p class="muted" data-availability-summary></p>
        <ul class="bullet-list stack" data-availability-points></ul>
        <p class="muted" data-work-preference></p>
      </article>

      <article class="panel stack" aria-labelledby="topics-title">
        <h2 id="topics-title">Reasons to reach out</h2>
        <p class="muted">I’m especially open to conversations around:</p>
        <ul class="topic-list" data-contact-topics></ul>
      </article>
    </section>
  </main>

  <div class="copy-toast" role="status" aria-live="polite" data-copy-toast hidden></div>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="assets/js/main.js"></script>
  <script type="module">
    import { contactData } from "./assets/data/contact-data.js";
    import { renderContactPage } from "./assets/js/contact.js";

    const intro = document.querySelector("[data-contact-intro]");
    if (intro) intro.textContent = contactData.intro || "TODO: Add verified contact intro.";

    renderContactPage();
  </script>
</body>
</html>
